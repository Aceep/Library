name: Preprod CI

on:
  push:
    branches: [ preprod ]
  pull_request:
    branches: [ preprod ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Lint
        run: npm run lint --if-present
      - name: Install Railway CLI
        run: |
          curl -sSL https://railway.app/install.sh | sh

      - name: Deploy to Railway (preprod)
        if: success()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT: ${{ secrets.RAILWAY_PROJECT }}
          RAILWAY_PREPROD_ENV: ${{ secrets.RAILWAY_PREPROD_ENV }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN not set — skipping deploy. Set the secret in repo settings.";
            exit 1;
          fi
          if [ -n "${RAILWAY_PROJECT}" ]; then
            railway link --project "${RAILWAY_PROJECT}" || true
          fi
          # Attempt to deploy/promote — prefer targeting the explicit preprod environment if provided
          if [ -n "${RAILWAY_PREPROD_ENV}" ]; then
            railway up --environment "${RAILWAY_PREPROD_ENV}" --detach || railway deploy --environment "${RAILWAY_PREPROD_ENV}" || true
          else
            railway up --detach || railway deploy || true
          fi
          echo "✅ Deploy completed"
          exit 0
