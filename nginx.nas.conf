# Le relais de l'instance hébergée : la SPA **et** l'API sous une seule origine.
#
# C'est ce qui garde le cookie de session en `SameSite=Lax` : le navigateur voit
# un seul site, ne joint donc jamais le cookie à une requête venue d'ailleurs,
# et le CSRF est fermé sans qu'aucun code n'ait à s'en occuper. Deux origines
# imposeraient `SameSite=None`, donc la protection CSRF applicative, donc un
# en-tête que le front doit penser à joindre partout — un mécanisme de plus à ne
# jamais casser, pour séparer deux choses qui tournent sur la même machine.
#
# Le découpage recopie exactement le proxy de `vite.config.ts` : le front ne
# sait pas qu'il a changé d'hôte. `src/api/client.ts` appelle `/api/...`, et
# `src/api/covers.ts` réécrit déjà en relatif toute jaquette dont le chemin
# commence par `/covers`.

server {
  # 8080 et non 80 : c'est ce que `tailscale funnel` vise sur 127.0.0.1, dans
  # l'espace réseau que ce conteneur partage avec lui.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Les jaquettes recopiées passent par ici ; le reste est du JSON.
  client_max_body_size 4m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Le résolveur interne de Docker.
  #
  # Sans lui — et sans la variable qui l'oblige à s'en servir —, nginx résout
  # `api` **une seule fois**, au démarrage, et garde l'adresse. Un redémarrage
  # du conteneur `api` lui donne une nouvelle IP, et le relais continue de
  # parler à une adresse morte jusqu'à ce qu'on redémarre nginx. La panne
  # ressemble à « l'API est tombée » alors qu'elle répond très bien.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $amont api;
    # Le préfixe `/api` n'appartient qu'au relais : l'API sert `/health`,
    # `/media`, `/auth/login`. `break` fige l'URI réécrite, que `proxy_pass`
    # sans partie URI transmet telle quelle.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$amont:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # En dur, et c'est juste : rien n'atteint ce relais autrement que par le
    # Funnel, qui termine le TLS. Recopier `$scheme` dirait « http », puisque
    # c'est en clair que tailscaled nous parle sur la boucle locale.
    proxy_set_header X-Forwarded-Proto https;

    # La recherche interroge des sources externes derrière un disjoncteur et une
    # file d'attente ; une passe froide dépasse largement les 60 s par défaut de
    # nginx, et se solderait par un 504 que rien n'explique.
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  location /covers/ {
    set $amont_jaquettes api;
    # Pas de réécriture : l'API sert bien `/covers/<clé>`.
    proxy_pass http://$amont_jaquettes:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Les fichiers construits par Vite portent une empreinte dans leur nom : leur
  # contenu ne change jamais sous un même nom. `index.html`, lui, ne doit jamais
  # être mis en cache, sinon un déploiement ne se voit pas.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
