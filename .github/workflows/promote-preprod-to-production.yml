name: Promote Preprod → Production (requires approval)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to deploy (e.g. refs/heads/preprod)'
        required: true
        default: 'refs/heads/preprod'

jobs:
  promote:
    name: Promote to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout preprod ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Install Railway CLI
        run: |
          curl -sSL https://railway.app/install.sh | sh

      - name: Deploy to Railway (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT: ${{ secrets.RAILWAY_PROJECT }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN not set — set the secret in repo settings";
            exit 1;
          fi
          railway login --apiKey "${RAILWAY_TOKEN}"
          if [ -n "${RAILWAY_PROJECT}" ]; then
            railway link --project "${RAILWAY_PROJECT}" || true
          fi
          railway up --detach || railway deploy || true
          echo "✅ Deploy completed"
          exit 0
