name: CI

# Sur main et sur les propositions de fusion. Les branches de travail sont
# couvertes par leur pull request : les vérifier deux fois ne dirait rien de
# plus et doublerait l'attente.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verifier:
    name: Contrat, lint, tests et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20 exigé par `engines` et `.nvmrc` : Vite 5 et openapi-typescript
      # ne tournent pas en deçà.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` plutôt que `npm install` : il installe exactement le lockfile
      # et échoue s'il diverge de package.json, au lieu de le réécrire en
      # silence.
      - name: Installer les dépendances
        run: npm ci

      # Le garde-fou du contrat.
      #
      # `src/api/types.ts` est **engendré** depuis `contract/openapi.json`, et
      # commité pour que le dépôt compile sans le back sous la main. Deux
      # dérives sont possibles, cette étape ferme les deux : quelqu'un édite
      # `types.ts` à la main, ou quelqu'un met à jour le contrat sans
      # régénérer. Dans les deux cas, `diff` affiche exactement ce qui manque.
      #
      # Ce qu'elle ne peut pas voir : que `contract/openapi.json` a pris du
      # retard sur le back, qui est un dépôt privé et séparé. C'est
      # `npm run contract:pull` qui met les deux à jour d'un geste, et la revue
      # de la PR qui lit ce que le contrat a changé.
      - name: Contrat et types engendrés
        run: npm run types:check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # `npm run build` enchaîne `tsc --noEmit` puis `vite build` : la
      # compilation des types est donc couverte ici, pas besoin d'une étape à
      # part.
      - name: Build
        run: npm run build
